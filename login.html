<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicIsTherapy — Giriş</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-card">
            <p class="login-kicker">MusicIsTherapy</p>
            <h1 class="login-title">Hesabına daxil ol</h1>
            <p class="login-copy">Frontend artıq Node.js backend ilə işləyir. Demo hesabı ilə daxil ola bilərsən.</p>

            <form id="loginForm" class="login-form">
                <label class="field">
                    <span>İstifadəçi adı</span>
                    <input type="text" id="username" name="username" placeholder="lacin" autocomplete="username" required>
                </label>

                <label class="field">
                    <span>Şifrə</span>
                    <input type="password" id="password" name="password" placeholder="salam123" autocomplete="current-password" required>
                </label>

                <p id="error-msg" class="error-msg" role="alert" aria-live="polite"></p>
                <button id="loginBtn" type="submit" class="btn-login">Daxil ol</button>
            </form>

            <p class="auth-note">Demo: <strong>lacin</strong> / <strong>salam123</strong></p>
        </section>
    </main>

    <script src="login.js" defer></script>
</body>
</html>
